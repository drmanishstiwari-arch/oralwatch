/* Layout: Inshorts-style column. Black chrome (tabs, bottom nav), one full-height card per swipe:
   image on top, dark one-line ribbon in the middle, 2-line headline + ~60-word takeaway below, small footer with actions.
   Overlays: animated splash logo, first-run track picker, bottom sheets. */
:root{
  --chrome:#03191C; --chrome-ink:#FFFFFF; --chrome-dim:#8DB3AF; --chrome-card:#0E2C30;
  --card:#FFFFFF; --ink:#141414; --body:#3A3A3C; --muted:#8A8A8E; --line:#E5E5EA;

  --f-body:"Figtree","Segoe UI",system-ui,sans-serif; --f-hand:"Gaegu","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --card:#161618; --ink:#F2F2F7; --body:#C9C9CF; --muted:#8E8E93; --line:#2C2C2E;
  --ribbon:#2A2A2E; --ribbon-dim:#AEAEB2; --teal:#5FE0CF; --teal-ink:#03211F; --sheet:#1C1C1E; --chip:#2C2C2E; color-scheme:dark } }
:root[data-theme="dark"]{
  --card:#161618; --ink:#F2F2F7; --body:#C9C9CF; --muted:#8E8E93; --line:#2C2C2E;
  --ribbon:#2A2A2E; --ribbon-dim:#AEAEB2; --teal:#5FE0CF; --teal-ink:#03211F; --sheet:#1C1C1E; --chip:#2C2C2E; color-scheme:dark }

html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--chrome)}

.tab[aria-selected="true"]{color:var(--chrome-ink);border-color:var(--chrome-ink)}

/* gentle motion for cartoons and charts, only on the card in view */
.cb{transform-box:fill-box;transform-origin:50% 100%}
.card.vis .cb{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-4px) rotate(-2deg)}65%{transform:translateY(-1px) rotate(1.5deg)}}

.tool[aria-pressed="true"] svg{fill:currentColor}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

button:focus-visible,a:focus-visible{outline:2px solid #5B8CFF;outline-offset:2px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--card);border-radius:18px 18px 0 0;padding:24px;line-height:1.5}
.sheet-wrap{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:480px;max-height:80%;overflow-y:auto;background:var(--sheet);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid button,.grid a{border:0;background:var(--chip);color:var(--ink);font:600 14px var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.grid [aria-pressed="true"]{background:var(--ink);color:var(--card)}

/* splash: logo B. Coral tile spins in (3D), swipe card slides in, the flap leaf grows from its pedicle and sways to the right with a light sheen, wordmark flips in */
.splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;overflow:hidden;background:radial-gradient(120% 85% at 50% 38%,#0F5A5E 0%,#06302F 55%,#021315 100%);transition:opacity .6s}
.splash.out{opacity:0;pointer-events:none}
.orbs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(64px);opacity:.36;animation:drift 7s ease-in-out infinite alternate}
.orbs i:nth-child(1){background:#46D9C3;left:-18vmax;top:-14vmax}
.orbs i:nth-child(2){background:#0B8A92;right:-22vmax;top:22vh;animation-delay:-2.5s}
.orbs i:nth-child(3){background:#F4B860;left:4vmax;bottom:-28vmax;animation-delay:-4.5s}
@keyframes drift{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.stage{perspective:800px}
.logo{width:156px;height:156px;display:block;filter:drop-shadow(0 22px 34px rgb(0 0 0 / .5)) drop-shadow(0 0 40px rgb(70 217 195 / .35))}
.logo .tile,.logo .scard,.logo .grow,.logo .sway{transform-box:view-box}
.logo .tile{transform-origin:60px 60px}
.logo .scard{transform-origin:60px 59px}
.logo .grow,.logo .sway{transform-origin:60px 94px}
.splash:not(.run) .logo{animation:breathe 2.6s ease-in-out infinite}
.logo .sway{animation:sway 2.6s ease-in-out infinite}
.run .logo{animation:spin 1.5s cubic-bezier(.18,.9,.25,1) both}
.run .logo .scard{animation:cardin .8s .7s cubic-bezier(.2,.9,.3,1.2) both}
.run .logo .grow{animation:growl 1s 1.1s cubic-bezier(.25,1.5,.5,1) both}
.run .logo .sway{animation:sway 2.6s 2.1s ease-in-out infinite}
.run .logo .vein{stroke-dasharray:60;animation:draw .9s 1.6s ease-out both}
.run .logo .ped{stroke-dasharray:40;animation:draw .6s 1.9s ease-out both}
.run .logo .sheen{animation:sheen 1.6s 2.3s ease-in-out infinite}
@keyframes spin{0%{transform:perspective(600px) rotateY(-540deg) rotateX(25deg) scale(.2);opacity:0}65%{transform:perspective(600px) rotateY(12deg) rotateX(-6deg) scale(1.07);opacity:1}100%{transform:perspective(600px) rotateY(0) scale(1);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

@keyframes growl{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0) skewX(0)}30%{transform:rotate(9deg) skewX(-5deg)}55%{transform:rotate(3deg) skewX(2deg)}75%{transform:rotate(7deg) skewX(-3deg)}}
@keyframes sheen{0%{transform:translateX(0)}70%,100%{transform:translateX(110px)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
.word{font:800 46px "Plus Jakarta Sans",var(--f-body);letter-spacing:-.025em;white-space:nowrap;perspective:600px;color:#E3FFFA}

.a2hs{display:flex;gap:14px;align-items:center}.a2hs svg{width:58px;height:58px;flex:0 0 auto;border-radius:14px}.a2hs div{display:flex;flex-direction:column;gap:4px}.a2steps{color:var(--ink)!important}.obnote{margin:6px 0 0;font-size:13px;opacity:.75;text-align:center}

const LIB=[
{id:'o-burden',tr:'a',onc:1,cat:'Early detection',ev:'Cost-of-illness study · ecancer 2021',img:'img/q-scc-lip.jpg',alt:'Ulcerated carcinoma of the lower lip',
 head:"Half of Indians with oral cancer die within a year",
 take:"India records about 144,000 new lip and oral cavity cancers a year, projected to rise 69% by 2045. Half of these patients die within the first year. Not because the disease is untreatable, but because it arrives late. Most of them sat in a dental chair months earlier. The dentist sees the mucosa of every patient at every visit: that is the screening programme India already has.",
 rib:"Most late oral cancers passed through a dental clinic first",more:"Read the study",u:"https://pubmed.ncbi.nlm.nih.gov/?term=cost+of+illness+oral+cancer+India+Singh+Chaukar+2021",likes:0},
{id:'o-3week',tr:'a',onc:1,cat:'Early detection',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',img:'img/q-scc-tongue.jpg',alt:'Proliferative lesion on the lateral border of the tongue',
 head:"The three-week rule",
 take:"Any oral ulcer, patch or lump that lasts more than three weeks gets a biopsy or a referral. First remove the obvious irritant: the sharp cusp, the broken tooth, the denture flange. Review at two weeks. Healed: discharge. Unchanged or larger: biopsy. There is no box on this pathway for a second course of anything.",
 rib:"Not healed in 3 weeks: biopsy or refer, never re-prescribe",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-trialrx',tr:'a',onc:1,cat:'Early detection',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',
 head:"Four prescriptions that turn stage I into stage IV",
 take:"Empirical antibiotics. Topical steroids, which improve the surface and hide the lesion. Vitamin and multivitamin gels for a 'deficiency ulcer'. Repeated denture adjustment or extraction, treating the consequence as the cause. Each one turns a three-week ulcer into a three-month ulcer. Delay by the professional is the largest part of the delay we can prevent.",
 rib:"Antibiotic, steroid, vitamin, denture adjustment: each buys the tumour a month",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-exam',tr:'a',onc:1,cat:'Early detection',ev:'Technique · NIH Detecting Oral Cancer guide', head:"The 90-second oral examination",
 take:"Dentures out, gauze in hand, a proper light. Lips and sulci on both sides, then the retromolar trigone. Hold the tongue in gauze and pull it to each side: the lateral border is the site most often missed. Floor of mouth and ventral tongue, palpated with one finger inside and one outside. Palate, tonsillar fossae, mouth opening. Finally the neck from behind, levels I to V.",
 rib:"Pull the tongue to each side: the lateral border is where cancers hide",more:"Read the NIH guide",u:"https://www.nidcr.nih.gov/health-info/oral-cancer",likes:0},
{id:'o-redflags',tr:'a',onc:1,cat:'Early detection',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',img:'img/c-scc-tongue.jpg',cred:'Photo: Dikkisherpa5, CC0',alt:'Ulcerated carcinoma of the lateral tongue',
 head:"Five findings that mean cancer until proven otherwise",
 take:"An irregular surface. Bleeding on touch. Indurated margins. A proliferative or ulcerated lesion. A lump in the neck. Any one of these: biopsy now, or refer this week. Do not prescribe and do not wait. Photo: Dikkisherpa5, CC0, Wikimedia Commons.",
 rib:"Induration, bleeding, irregular edge, growth, neck node: act this week",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-rates',tr:'a',onc:1,cat:'Premalignancy',ev:'Meta-analysis · Head Neck 2020',
 fig:{type:'bars',title:'Malignant transformation by subtype',unit:'%',bars:[{l:'PVL',v:49.5,hi:1},{l:'Erythroplakia',v:33.1},{l:'Homog. leukoplakia',v:8.6},{l:'OSMF',v:6},{l:'Lichen planus',v:1.4}],from:'Iocca 2020; Murthy 2022',ch:'tumour'},
 head:"Not all white and red patches are equal",
 take:"Pooled transformation rates: proliferative verrucous leukoplakia 49.5%, erythroplakia 33.1%, homogeneous leukoplakia 8.6%, oral submucous fibrosis 6%, oral lichen planus 1.4%. Speckled, nodular or verrucous leukoplakia transforms about five times more often than the homogeneous type. The most dangerous-looking patch is also the most dangerous.",
 rib:"Erythroplakia and PVL go straight to biopsy",more:"Read the meta-analysis",u:"https://doi.org/10.1002/hed.26006",likes:0},
{id:'o-homog',tr:'a',onc:1,cat:'Premalignancy',ev:'Meta-analysis · Head Neck 2020',img:'img/c-nih-homog-leuko.jpg',cred:'Photo: NIH/NIDCR, public domain',alt:'Homogeneous leukoplakia, NIH/NIDCR, public domain',
 head:"Homogeneous leukoplakia: benign look, real risk",
 take:"Uniformly white, flat or finely wrinkled, sharply demarcated, and it does not rub off. The pooled transformation rate is 8.6%. Only histology separates hyperkeratosis from high-grade dysplasia, and the dysplasia grade is the strongest predictor of progression. Stopping the habit lowers future risk but tells you nothing about what is already there. Photo: NIH/NIDCR, public domain.",
 rib:"Stop the habit and biopsy: you cannot grade a patch by looking",more:"Read the meta-analysis",u:"https://doi.org/10.1002/hed.26006",likes:0},
{id:'o-speckled',tr:'a',onc:1,cat:'Premalignancy',ev:'Meta-analysis · Head Neck 2020',img:'img/q-speckled-leuko.jpg',alt:'Speckled red and white leukoplakia at the commissure',
 head:"Speckled leukoplakia: biopsy the red, not the white",
 take:"A mixed red-and-white, nodular or verrucous patch is non-homogeneous leukoplakia. It transforms about five times more often than a uniform white patch. Take the biopsy from the red or most abnormal area, not from the centre of the white part, and include adjacent normal mucosa.",
 rib:"Non-homogeneous surface: about five times the risk",more:"Read the meta-analysis",u:"https://doi.org/10.1002/hed.26006",likes:0},
{id:'o-erythro',tr:'a',onc:1,cat:'Premalignancy',ev:'Meta-analysis · Head Neck 2020',img:'img/q-erythroplakia.jpg',alt:'Velvety red patch on the lateral tongue',
 head:"A red patch with no cause: biopsy, never observe",
 take:"A velvety red plaque that cannot be explained by anything else is erythroplakia until proved otherwise. A third of these are, or will become, carcinoma (33.1%). Never observe it and never treat it empirically as candidiasis.",
 rib:"Erythroplakia: 33% transformation",more:"Read the meta-analysis",u:"https://doi.org/10.1002/hed.26006",likes:0},
{id:'o-osmf',tr:'a',onc:1,cat:'Premalignancy',ev:'Meta-analysis · J Clin Med 2022',img:'img/q-osmf.jpg',alt:'Blanched buccal mucosa with fibrous bands in submucous fibrosis',
 head:"Submucous fibrosis: the trismus hides the tumour",
 take:"Blanching, loss of elasticity, palpable fibrous bands and progressive trismus, driven by areca nut and now seen in the twenties. The transformation rate is about 6%. Reduced mouth opening is exactly what stops you seeing the cancer behind it. Stop areca absolutely, start mouth-opening exercises, and examine the whole mucosa at every visit.",
 rib:"Every OSMF patient needs the whole mouth examined at every visit",more:"Read the meta-analysis",u:"https://pubmed.ncbi.nlm.nih.gov/?term=Murthy+malignant+transformation+oral+submucous+fibrosis+2022",likes:0},
{id:'o-osmfca',tr:'a',onc:1,cat:'Premalignancy',ev:'Case · Dr M. S. Tiwari',img:'img/q-osmf-ca.jpg',alt:'Malignant ulcer arising in oral submucous fibrosis',
 head:"A new ulcer in OSMF is a biopsy, not a steroid",
 take:"This patient had long-standing submucous fibrosis and restricted mouth opening. A new ulceroproliferative area turned out to be carcinoma. In a known OSMF patient, any new ulcer, growth or induration is malignant change until proved otherwise. Biopsy it or refer the same week, instead of injecting steroid into it.",
 rib:"New ulcer, growth or induration in OSMF: refer the same week",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-olp',tr:'a',onc:1,cat:'Premalignancy',ev:'Review · OOOO 2018',img:'img/q-olp-nodular.jpg',alt:'Buccal mucosa with lichen planus and a raised area',
 head:"Lichen planus that changes is a new lesion",
 take:"Oral lichen planus carries a low overall transformation rate of 1.4%, but that number applies to the condition, not to a lesion that has just changed. Thickening, nodularity, persistent ulceration or induration in a known OPMD is biopsied as a new lesion. The most dangerous patient in the clinic is the one whose diagnosis was made years ago.",
 rib:"Familiarity is how a low-risk lesion becomes a late cancer",more:"Read the review",u:"https://pubmed.ncbi.nlm.nih.gov/?term=Speight+oral+potentially+malignant+disorders+risk+of+progression+2018",likes:0},
{id:'o-variants',tr:'a',onc:1,cat:'Normal variants',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',img:'img/q-linea-alba.jpg',alt:'Linea alba along the occlusal plane',
 head:"Over-referral is not a safe error",
 take:"Linea alba: bilateral, symmetrical, at the occlusal plane. Leukoedema: diffuse greyish-white, disappears when the cheek is stretched. Fordyce granules: yellow submucosal dots, ectopic sebaceous glands. Aphthous ulcer: painful, shallow, recurrent, gone in 10–14 days. The discriminator is never the colour. It is induration, fixity, duration, and whether it heals.",
 rib:"Know the normal variants: reassure, explain, photograph",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-biopsy',tr:'a',onc:1,cat:'Biopsy',ev:'Technique · Dr M. S. Tiwari, IDA CDE 2026',
 head:"The biopsy is yours to take",
 take:"Punch biopsy suits accessible mucosal patches: take it from the edge, with adjacent normal mucosa. For a suspected carcinoma, the incisional knife biopsy is the default: go deep enough to show invasion, because a superficial shave reads as dysplasia and buys the tumour another month. Avoid the necrotic centre and cautery artefact, label one pot per site, and write the clinical suspicion on the form.",
 rib:"A biopsy taken today by you beats one taken in six weeks",more:"Ask about the biopsy workshop",u:"https://wa.me/917238868584",likes:0},
{id:'o-imaging',tr:'a',onc:1,cat:'Biopsy',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',
 head:"No CT, MRI or PET before you refer",
 take:"CECT shows bone involvement and nodes; it is the workhorse for gingivobuccal tumours. CEMRI shows soft tissue and depth of invasion, which now decides T stage; best for tongue and floor of mouth. PET-CT is for selected advanced cases, never for screening. A biopsy report and a phone call move the patient faster than a scan, which usually gets repeated with the right protocol anyway.",
 rib:"Imaging is the specialist's job: biopsy and call",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-prert',tr:'a',onc:1,cat:'Before & after treatment',ev:'Guideline · ISOO-MASCC-ASCO, J Clin Oncol 2024',
 head:"Before radiotherapy: extract at least two weeks ahead",
 take:"Assess every patient before curative radiotherapy. Extract teeth of poor prognosis in the radiation field: advanced periodontal disease, periapical disease, gross caries, partly erupted third molars. Allow at least two weeks of healing before the first fraction, but never let dentistry delay radiotherapy for a fast-growing tumour. Afterwards, avoid extractions in the high-dose field; prefer endodontics and restorations.",
 rib:"Most osteoradionecrosis is prevented in the dental chair",more:"Read the guideline",u:"https://pubmed.ncbi.nlm.nih.gov/?term=ISOO+MASCC+ASCO+osteoradionecrosis+guideline+2024",likes:0},
{id:'o-after',tr:'a',onc:1,cat:'Before & after treatment',ev:'Clinical rule · Dr M. S. Tiwari, IDA CDE 2026',
 head:"After treatment, the dentist sees them first",
 take:"Most recurrences and second primaries present to the local clinician. Examine the whole mucosa, the flap margins and the neck at every visit. Any new ulcer, lump, pain or numbness in a treated patient goes straight back to the treating unit. A free flap that turns dusky, blue or swollen in the first fortnight is a vascular emergency: phone the operating unit the same day.",
 rib:"New ulcer, lump or numbness after treatment: send them back, don't prescribe",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-neck',tr:'a',onc:1,cat:'Before & after treatment',ev:'RCT · N Engl J Med 2015',
 fig:{type:'bars',title:'3-year overall survival, early oral cancer',unit:'%',bars:[{l:'Elective neck dissection',v:80,hi:1},{l:'Watch and wait',v:67.5}],from:"D'Cruz et al., NEJM 2015",ch:'node'},
 head:"A clinically normal neck is not an empty neck",
 take:"In the Tata Memorial trial of 596 patients with early node-negative oral cancer, elective neck dissection gave 3-year overall survival of 80% against 67.5% with watch-and-wait. Hidden nodal disease was common. Depth of invasion now decides whether the neck is treated, which is why your biopsy must be deep enough to show it.",
 rib:"Elective neck dissection improved survival in early oral cancer",more:"Read the trial",u:"https://www.nejm.org/doi/full/10.1056/NEJMoa1506007",likes:0},
{id:'o-recon',tr:'a',onc:1,cat:'Before & after treatment',ev:'Technique · Microvascular reconstruction',
 head:"Reconstruction is not closure. It is function.",
 take:"A free flap is living tissue moved with its artery and vein and joined to neck vessels under the microscope. It lets the surgeon take the margin the cancer needs. Radial forearm skin keeps a rebuilt tongue mobile; fibula bone rebuilds the jaw and later accepts implants. Average free flap success is about 95%. But every one of these operations exists because a lesion was not biopsied at one centimetre.",
 rib:"Free flaps restore speech, swallowing and the jaw",more:"Discuss a case",u:"https://wa.me/917238868584",likes:0},
{id:'o-author',tr:'a',onc:1,author:1,cat:'About OralWatch',ev:'Oral Oncosurgeon & Microvascular Reconstruction Surgeon',img:'img/dr-tiwari.jpg',alt:'Dr Manish S. Tiwari',
 head:"OralWatch is made by Dr Manish S. Tiwari",

 rib:"Discuss a case with Dr Manish: WhatsApp +91 72388 68584",more:"Know more",u:"https://www.drmanishtiwari.com",likes:0}

function normMob(raw,country){
  const t=String(raw||'').trim(), dg=t.replace(/\D/g,'');
  if(dg.length<10||dg.length>15)return '';
  if(t.startsWith('+'))return '+'+dg;
  if(dg.length===10&&(!country||/india/i.test(country)))return '+91'+dg;
  if(dg.length===11&&dg[0]==='0')return '+91'+dg.slice(1);
  if(dg.length===12&&dg.startsWith('91'))return '+'+dg;
  return '+'+dg;
}

    <li><span class="ig-n">3</span><div>Tap <span class="ig-pill ig-add">Add</span> at the top right. Done: OralWatch is on your home screen.</div></li>
   </ol>
   <button class="ig-done" id="ig-done">I've added it</button></div>
   <div class="ig-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v15M6 13l6 6 6-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}
function restoreToken(){
  const p=S.profile?{name:S.profile.name,role:S.profile.role,focus:S.profile.focus,country:S.profile.country,hcp:true,terms:true,termsVersion:S.profile.termsVersion,consentAt:S.profile.consentAt,joinedAt:S.profile.joinedAt,restored:true}:null;
  const d={profile:p,guest:!!S.guest,interests:S.interests,goal:S.goal,liked:S.liked,saved:S.saved,days:S.days,vid:S.vid,theme:S.theme,textSize:S.textSize,a2hs:{done:1}};
  let tok=btoa(unescape(encodeURIComponent(JSON.stringify(d))));
  if(tok.length>6000){d.liked={};d.saved={};tok=btoa(unescape(encodeURIComponent(JSON.stringify(d))));}
  return tok.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
let stampT=null;
async function stampInstallUrl(){
  if(!isIOS()||isStandalone()||(!S.profile&&!S.guest))return;
  const u=location.origin+location.pathname+'?r='+restoreToken();
  history.replaceState(null,'',u);
  try{const m=await (await fetch('manifest.webmanifest')).json();m.start_url=u;m.scope=location.origin+location.pathname.replace(/[^/]*$/,'');
    m.icons=(m.icons||[]).map(i=>({...i,src:new URL(i.src,location.href).href}));
    const l=document.querySelector('link[rel=manifest]');if(l)l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));}catch(e){}
  clearTimeout(stampT);stampT=setTimeout(()=>history.replaceState(null,'',location.pathname),10*60e3);
}
function wireIosGuide(sh){
  stampInstallUrl();
  const c=sh.querySelector('#ig-copy'), d=sh.querySelector('#ig-done');
  if(c)c.onclick=()=>{const done=()=>{c.textContent='Link copied. Now open Safari and paste';track('ios-copy-link');};
    (navigator.clipboard?navigator.clipboard.writeText(INSTALL_URL):Promise.reject()).then(done,()=>{const t=document.createElement('textarea');t.value=INSTALL_URL;document.body.appendChild(t);t.select();try{document.execCommand('copy');done();}catch(e){c.textContent=INSTALL_URL;}t.remove();});};
  if(d)d.onclick=()=>{S.a2hs={...(S.a2hs||{}),done:1};persist();closeSheet();hideIosBanner();track('install-ios');toast('Great. Open OralWatch from your home screen');};
}
function hideIosBanner(){const b=$('ios-banner');if(b)b.remove();}
let iosBannerShown=false;
function showIosBanner(){
  const a=S.a2hs||{}, now=Date.now();
  const day=todayKey();
  if(iosBannerShown||(a.bn||0)>=6)return;          /* at most 6 reminders in all */
  if(a.bd===day||a.ld===day)return;                 /* at most one a day, never on the day of the full guide */
  iosBannerShown=true;
  S.a2hs={...a,bn:(a.bn||0)+1,bl:now,bd:day};persist();track('ios-banner');
  document.body.insertAdjacentHTML('beforeend',`<div class="ios-banner" id="ios-banner" role="dialog" aria-label="Add OralWatch to your home screen"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#brandmark"/></svg><div class="ib-t"><b>Add OralWatch to your home screen</b><span>Opens in one tap, like an app</span></div><button class="ib-how" id="ib-how">How?</button><button class="ib-x" id="ib-x" aria-label="Close">×</button></div>`);
  $('ib-how').onclick=()=>{hideIosBanner();a2hsSheet();};
  $('ib-x').onclick=()=>{hideIosBanner();track('ios-banner-close');};
}
if(isIOS()&&isStandalone()&&!(S.a2hs||{}).done){S.a2hs={...(S.a2hs||{}),done:1};persist();track('open-installed-ios');}
/* Android, opened from the install link: a one-tap install screen before anything else */
/* Android browsers: only Chrome (and Samsung Internet, Edge) offer one-tap install. Others get "Open in Chrome". */
const UA=navigator.userAgent;
const isAndroid=()=>/Android/i.test(UA);
const canOneTap=()=>/Chrome\/\d+/.test(UA)&&!/(HeyTapBrowser|OppoBrowser|OnePlusBrowser|MiuiBrowser|XiaoMi|VivoBrowser|UCBrowser|OPR\/|OPX\/|Opera|YaBrowser|Firefox|DuckDuckGo|Brave|PhxBrowser|HiBrowser|HuaweiBrowser|QQBrowser|Instagram|FBAN|FBAV|LinkedInApp|Line\/|wv\)|Version\/\d)/.test(UA);
const chromeIntent=()=>{const u=location.origin+location.pathname.replace(/[^/]*$/,'')+'install/';return 'intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(u)+';end';};
function openInChrome(){track('open-in-chrome');location.href=chromeIntent();}
function androidInstallScreen(){
  if(!canOneTap()){
    const o=document.createElement('div');o.className='inst';o.id='inst';
    o.innerHTML=`<svg class="inst-logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#brandmark"/></svg>
     <div class="inst-word">oral<b>watch</b></div>
     <p class="inst-tag">Dental evidence in three minutes a day</p>
     <button class="inst-btn" id="inst-chrome">Open in Chrome to install</button>
     <p class="inst-note">This browser can't install apps. Chrome will open OralWatch with a one-tap <b>Install</b> button.</p>
     <button class="inst-skip" id="inst-short" style="margin-top:6px">Or add a shortcut in this browser</button>
     <button class="inst-skip" id="inst-skip" style="margin-top:4px">Continue in this browser</button>`;
    document.body.appendChild(o);
    const done=()=>{o.classList.add('out');setTimeout(()=>o.remove(),450);};
    $('inst-chrome').onclick=openInChrome;
    $('inst-short').onclick=()=>{track('install-shortcut');o.querySelector('.inst-note').innerHTML='Tap this browser\'s menu (<b>☰</b> at the bottom, or <b>⋮</b> at the top) and choose <b>Add to Home screen</b>. The shortcut opens OralWatch inside this browser; for the full-screen app, use <b>Open in Chrome</b>.';$('inst-short').remove();};
    $('inst-skip').onclick=()=>{done();track('install-skip');};
    track('install-otherbrowser');
    return;
  }
  const o=document.createElement('div');o.className='inst';o.id='inst';
  o.innerHTML=`<svg class="inst-logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#brandmark"/></svg>
   <div class="inst-word">oral<b>watch</b></div>
   <p class="inst-tag">Dental evidence in three minutes a day</p>
   <button class="inst-btn" id="inst-go">Install app</button>
   <p class="inst-note" id="inst-note">Free · no app store · takes 2 seconds</p>
   <button class="inst-skip" id="inst-skip">Continue in browser</button>`;
  document.body.appendChild(o);
  const done=()=>{o.classList.add('out');setTimeout(()=>o.remove(),450);};
  const fallback=()=>{$('inst-note').innerHTML='If OralWatch is already on your home screen, just open it from there. Otherwise tap the browser menu <b>⋮</b> and choose <b>Install app</b>, or tap <b>Try again</b> in a few seconds.';$('inst-go').textContent='Try again';track('install-fallback');};
  addEventListener('beforeinstallprompt',()=>{const b=$('inst-go');if(b&&b.textContent!=='Install app'){b.textContent='Install app';$('inst-note').textContent='Free · no app store · takes 2 seconds';}});
  $('inst-skip').onclick=()=>{done();track('install-skip');};
  $('inst-go').onclick=async()=>{
    if(!deferredInstall){ // the browser may still be getting ready: wait up to 3 s
      $('inst-go').textContent='Getting ready…';
      for(let i=0;i<40&&!deferredInstall;i++) await new Promise(r=>setTimeout(r,250));
      if(!deferredInstall){fallback();return;}
    }
    const ev=deferredInstall;deferredInstall=null;ev.prompt();
    try{const r=await ev.userChoice;
      if(r.outcome==='accepted'){S.a2hs={...(S.a2hs||{}),done:1};persist();track('install');$('inst-go').textContent='Installed ✓';$('inst-note').textContent='Open OralWatch from your home screen.';setTimeout(done,1600);}
      else{$('inst-go').textContent='Install app';track('install-dismissed');}
    }catch(e){}
  };
}
function a2hsSheet(){
  const how=deferredInstall?'prompt':isIOS()?'ios':(isAndroid()&&!canOneTap())?'chrome':'other';
  const sh=openSheet(`<div class="a2hs"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#brandmark"/></svg><div><h3>Add OralWatch to your home screen</h3><p>Open it in one tap, full screen, like an app. Free, no app store needed.</p></div></div>
   ${how==='prompt'?'<div class="row"><button class="btn primary" id="a2-yes">Add to home screen</button><button class="btn ghost" id="a2-no">Not now</button></div>'
    :how==='ios'?iosGuideHTML()
    :how==='chrome'?'<p class="a2steps">This browser can\'t install apps. Open OralWatch in Chrome for a one-tap <b>Install</b>.</p><div class="row"><button class="btn primary" id="a2-chrome">Open in Chrome</button><button class="btn ghost" id="a2-no">Not now</button></div>'
    :/(FBAN|FBAV|Instagram|Line\/|LinkedInApp|wv\))/.test(navigator.userAgent)?'<p class="a2steps">This page opened inside another app. Tap the menu (⋮ or ⋯) and choose <b>Open in Chrome</b> (or <b>Open in browser</b>), then tap <b>Install</b>.</p>'
    :'<p class="a2steps">Open your browser menu (⋮) and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>'}`);
  track(how==='ios'?(iosInApp()?'a2hs-ios-inapp':'a2hs-ios'):'a2hs-shown');
  if(how==='ios')wireIosGuide(sh);
  const y=sh.querySelector('#a2-yes'),no=sh.querySelector('#a2-no');
  if(y)y.onclick=async()=>{const ev=deferredInstall;deferredInstall=null;closeSheet();if(!ev)return;ev.prompt();try{const r=await ev.userChoice;if(r.outcome==='accepted'){S.a2hs={...(S.a2hs||{}),done:1};persist();track('install');}}catch(e){}};
  if(no)no.onclick=()=>{closeSheet();track('a2hs-later');};
  const ch=sh.querySelector('#a2-chrome');if(ch)ch.onclick=()=>{closeSheet();openInChrome();};
}
document.addEventListener('click',e=>{if(e.target.closest('#p-a2hs')){closeSheet();setTimeout(a2hsSheet,250);}});
/* Install link: https://oralwatch.drmanishtiwari.com/install (or ?install=1) opens straight to the install prompt. */
if(new URLSearchParams(location.search).has('install')&&!isStandalone()){
  history.replaceState(null,'',location.pathname);
  track('install-link');
  /* iPhone: let them read first; the picture guide appears after 5 swipes (see maybeA2HS). Android: offer one-tap install straight away. */
  if(!isIOS())androidInstallScreen();
}
async function loadCards(){
  for(const u of CARDS_URLS){
    try{
      const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Math.floor(Date.now()/3e5),{cache:'no-store'});
      if(!r.ok)continue;
      const j=await r.json(), arr=Array.isArray(j)?j:(j.cards||[]);
      const next=arr.map(d=>({...d,id:'db-'+d.id,live:true})).filter(valid).map(c=>({...c,tr:['a','r','g'].includes(c.tr)?c.tr:'g',rib:c.rib||'New evidence',ev:c.ev||'New paper',likes:+c.likes||0})).sort((a,b)=>String(b.addedAt||'').localeCompare(String(a.addedAt||'')));
      if(!next.length)continue;
      return next;
    }catch(e){}
  }
  return null;
}
async function refreshLive(){
  const next=await loadCards();
  if(!next){if(!liveCards.length)liveStatus='Could not reach the live library just now; showing the built-in cards.';return;}
  const grew=next.length!==liveCards.length;
  liveCards=next; if(booted) renderChips();
  const last=next[0]?.addedAt?new Date(next[0].addedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):null;
  liveStatus=`New cards are added automatically from papers and news; latest ${last||'recently'}.`;
  if(!booted||!grew) return;
  const nNew=next.length-renderedLive;
  const onDone=(()=>{const d=$('done-card');if(!d)return false;const r=d.getBoundingClientRect(),f=feed.getBoundingClientRect();return Math.abs(r.top-f.top)<40;})();
  if(nNew>0){ if(onDone||!feed.querySelector('.card[data-id]')) render(); else {pendingLive=nNew;updatePill();} }
}
(async()=>{
  await refreshLive();
  const QS=new URLSearchParams(location.search), want=QS.get('c'), wantTip=QS.get('t');
  if(wantTip){const go=()=>{if(openTip(wantTip))sharedArrival('tip');};if(booted)go();else{const t=setInterval(()=>{if(booted){clearInterval(t);go();}},200);setTimeout(()=>clearInterval(t),15000);}}
  else if(want){const go=()=>{if(byId(want)){openCard(want);sharedArrival('card');}};if(booted)go();else{const t=setInterval(()=>{if(booted){clearInterval(t);go();}},200);setTimeout(()=>clearInterval(t),15000);}}
  setInterval(refreshLive,30*60e3);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshLive();});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
